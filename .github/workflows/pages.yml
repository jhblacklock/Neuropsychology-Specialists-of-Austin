name: Deploy site to GitHub Pages

# Publishes the contents of site/ on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static HTML — no build step. Jekyll would otherwise skip files and
      # folders beginning with an underscore.
      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      # Pre-cutover the site is served from a github.io sub-path, where
      # robots.txt is never read — crawlers only fetch it from a domain root,
      # and jhblacklock.github.io/robots.txt is not ours. So the staging build
      # gets a noindex meta injected into every page instead.
      #
      # This disarms itself: site/CNAME only exists once the custom domain is
      # configured, and from that build onward nothing is injected. Do not add
      # site/CNAME until DNS actually points at Pages — see REDIRECTS.md.
      - name: Keep the staging build out of search indexes
        run: |
          if [ -f site/CNAME ]; then
            echo "site/CNAME present — production build, no noindex injected."
            exit 0
          fi
          echo "No site/CNAME — staging build, injecting noindex."
          find site -name '*.html' -print0 | xargs -0 perl -0pi -e '
            s{\s*<meta name="robots"[^>]*>}{}g;
            s{(<meta charset="utf-8">)}{$1\n<meta name="robots" content="noindex, nofollow">}i;
          '
          echo "Injected into $(grep -rl "noindex, nofollow" site --include='*.html' | wc -l) files."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
