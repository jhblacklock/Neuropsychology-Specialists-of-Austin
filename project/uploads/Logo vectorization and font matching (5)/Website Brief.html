  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; }\n  doc-page:not(:defined) { visibility: hidden; }\n  a { color: #8f6521; text-decoration: none; }\n  a:hover { color: #b8842f; }\n<\u002Fstyle>\n<script src=\"edda45db-8bf7-487d-a146-d933dd7aa208\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<doc-page margin=\"0.85in\">\n\n  <div style=\"display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #383a44; padding-bottom:14px; margin-bottom:26px;\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5pt; letter-spacing:0.16em; color:#8a8578; margin-bottom:6px;\">BRAND &amp; WEBSITE BUILD BRIEF<\u002Fdiv>\n      <h1 style=\"margin:0; font-family:'Playfair Display',serif; font-size:23pt; font-weight:700; color:#383a44; line-height:1.15;\">Neuropsychology Specialists of Austin<\u002Fh1>\n    <\u002Fdiv>\n    <img src=\"d549cad2-99c2-4d4f-ae86-305ab258727a\" alt=\"\" style=\"width:0.95in; display:block; flex:none;\">\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Two deliverables, in order. A brand document that codifies the identity already established by the logo work, then a full website built from it. The website does not begin until the brand document is approved. The logo, colors, and typefaces are settled — the brand document extends them into a complete system rather than reopening them.<\u002Fp>\n\n  <h2 style=\"margin:0 0 12px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">LOCKED IDENTITY<\u002Fh2>\n\n  <div style=\"display:flex; gap:26px; margin-bottom:14px; break-inside:avoid;\">\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <span style=\"width:32px; height:32px; background:#b8842f; display:block; flex:none;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:9pt; line-height:1.7; color:#3d3a34;\">#B8842F<br><span style=\"color:#8a8578;\">gold, accent only<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <span style=\"width:32px; height:32px; background:#383a44; display:block; flex:none;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:9pt; line-height:1.7; color:#3d3a34;\">#383A44<br><span style=\"color:#8a8578;\">charcoal, primary text<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <span style=\"width:32px; height:32px; background:#fdfcfa; border:1px solid #ddd8ce; display:block; flex:none;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:9pt; line-height:1.7; color:#3d3a34;\">#FDFCFA<br><span style=\"color:#8a8578;\">paper ground<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; margin-bottom:24px; font-family:'Lora',serif; font-size:10.5pt; color:#3d3a34;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\">\n        <sc-raw-td style=\"padding:8px 14px 8px 0; width:42%;\">Headlines, practice name<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Playfair Display Bold<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\">\n        <sc-raw-td style=\"padding:8px 14px 8px 0;\">“of Austin”, pull quotes<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Playfair Display Italic SemiBold<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce; border-bottom:1px solid #ddd8ce;\">\n        <sc-raw-td style=\"padding:8px 14px 8px 0;\">Eyebrows, labels<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Montserrat SemiBold, caps, 0.24em<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">THE STRATEGIC BET<\u002Fh2>\n  <p style=\"margin:0 0 12px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Competing sites in this category fail in one of two ways: a template with a stock photo header and no real information, or a wall of clinical prose with no way to act on it. The site wins by answering the questions people actually arrive with, in the order they ask them.<\u002Fp>\n  <ol style=\"margin:0 0 14px; padding-left:22px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.75; color:#3d3a34;\">\n    <li>What is this and do I need it?<\u002Fli>\n    <li>Who are you, and are you actually qualified?<\u002Fli>\n    <li>What will happen to me, step by step, and how long will it take?<\u002Fli>\n    <li>What will it cost, and will insurance cover it?<\u002Fli>\n    <li>What do I do right now?<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Three consequences drive the design. The three-step process belongs on the home page with real durations attached, not buried in a subpage. Fees get published on a primary page — transparent pricing is the strongest trust signal in this category and almost no competitor offers it. And board certification is the differentiator: there are few board-certified neuropsychologists in Austin, so the credential is stated early and explained, not reduced to a badge graphic.<\u002Fp>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">SITEMAP<\u002Fh2>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; margin-bottom:14px; font-size:10.5pt; color:#3d3a34;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; width:40%; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Home<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Process, credentials, conditions, one call to book<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Neuropsychological Evaluation<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">What it is, who it's for, what's measured<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Intervention Services<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">The five programs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">The Process<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Consultation, testing, feedback<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Our Team<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Overview plus two bios — Bunner and Paulos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Fees &amp; Insurance<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Published rates, referrals, authorizations, payment<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">For Referring Providers<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">What to send, turnaround, report delivery<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Insights<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Blog index and post template<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce; border-bottom:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:7px 14px 7px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Contact &amp; Directions<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0; font-family:'Lora',serif;\">Address, map, parking, hours, forms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:10.5pt; line-height:1.6; color:#6b6659;\">Referring providers get a main-navigation entry, not a footer link — physicians and schools arrive by search or a colleague's recommendation and won't hunt for it. The page is written for a professional audience: denser, faster, no hand-holding.<\u002Fp>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">VOICE<\u002Fh2>\n  <p style=\"margin:0 0 10px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">The reader is usually a worried parent or the adult child of a declining parent. The site's job is to make this feel like the most competent option in Austin, and the process knowable.<\u002Fp>\n  <ul style=\"margin:0 0 24px; padding-left:20px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.8; color:#3d3a34;\">\n    <li>Explain, don't reassure. Precision is the reassurance.<\u002Fli>\n    <li>Say what a thing is, how long it takes, and what it costs.<\u002Fli>\n    <li>No “journey,” “empower,” “holistic,” “cutting-edge,” “state of the art.”<\u002Fli>\n    <li>Name the specific worry. Address the reader as “you.”<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">THE BLOG<\u002Fh2>\n  <p style=\"margin:0 0 12px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Built for volume, since posts will be generated on an ongoing schedule. An index that groups by a fixed set of five categories, and a post template that holds up at 400 words and at 2,500 — including the case where no image is supplied, which should look deliberate rather than unfinished. Three recent posts surface on the home page.<\u002Fp>\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">The brief carries an editorial standard for the generation task to inherit: every clinical claim cited inline, no diagnosis or treatment advice, each post attributed to Dr. Bunner or Dr. Paulos and reviewed by her before publishing. The three existing posts get retired — they're from 2018 to 2021 and set the wrong tone.<\u002Fp>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">DROP FROM THE CURRENT SITE<\u002Fh2>\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">The Links page, the Facebook callout as a primary footer element, and every trace of the old practice name, the old 711 W 38th Street address, and the temp domain in the copyright line.<\u002Fp>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">APPROVAL GATES<\u002Fh2>\n  <p style=\"margin:0 0 14px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Four stages, with a stop after each of the first two. Brand document. Then the home page and one interior page as full designs. Then the remaining pages. Then responsive behavior at 375, 768, and 1440.<\u002Fp>\n  <p style=\"margin:0 0 24px; font-family:'Lora',serif; font-size:11.5pt; line-height:1.65; color:#3d3a34;\">Nothing gets added that isn't in the brief — no section, page, statistic, testimonial, or photograph. No invented patient quotes, outcome figures, or credentials.<\u002Fp>\n\n  <h2 style=\"margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:9.5pt; font-weight:500; letter-spacing:0.16em; color:#8a8578;\">WHAT'S IN THE FOLDER<\u002Fh2>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:10.5pt; color:#3d3a34;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:8px 14px 8px 0; width:40%; font-family:'JetBrains Mono',monospace; font-size:9pt;\">BUILD BRIEF.md<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0; font-family:'Lora',serif;\">The full brief, including all page content rewritten from the existing site. Hand this to whoever builds it, or paste it into an AI tool as the prompt.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:8px 14px 8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">SESSION HANDOFF.md<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0; font-family:'Lora',serif;\">A shorter prompt that carries the locked brand, the mark, the lockup measurements, practice facts, and voice. Paste it to start a fresh session and add the task at the bottom.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:8px 14px 8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">Website Brief.html<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0; font-family:'Lora',serif;\">This document, self-contained. Opens in any browser and prints to PDF.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #ddd8ce; border-bottom:1px solid #ddd8ce;\"><sc-raw-td style=\"padding:8px 14px 8px 0; font-family:'JetBrains Mono',monospace; font-size:9pt;\">logo/<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0; font-family:'Lora',serif;\">The vector mark in gold, charcoal, and white.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
